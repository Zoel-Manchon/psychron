# Firmware distribution over mutual TLS.
#
# The node already holds a certificate to reach the broker; the same certificate
# is what gets it a firmware image. Serving updates over plain HTTP after going
# to the trouble of mTLS for telemetry would be the larger hole of the two: a
# reading that leaks is a room temperature, but an image that can be swapped in
# flight is arbitrary code on the device.

server {
    listen 8443 ssl;
    server_name psychron-fwserver;

    ssl_certificate     /certs/fwserver.crt;
    ssl_certificate_key /certs/fwserver.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The node must prove who it is before it is told what firmware exists.
    ssl_client_certificate /certs/ca.crt;
    ssl_verify_client on;

    root /firmware;
    autoindex off;

    # The manifest is small and changes on every release, so it must never be
    # served from a cache that would keep a node on an old version.
    location = /manifest.json {
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    location ~ \.bin$ {
        default_type application/octet-stream;
    }

    # Anything else is not part of the contract.
    location / {
        return 404;
    }
}
