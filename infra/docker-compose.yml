name: psychron

services:
  db:
    image: timescale/timescaledb:2.17.2-pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: psychron
      POSTGRES_USER: psychron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      # Timestamps are stored as timestamptz; keeping the server in UTC means the
      # container's locale can never shift what a reading means.
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Applied in filename order on first start of an empty volume only.
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U psychron -d psychron"]
      interval: 5s
      timeout: 5s
      retries: 20

  broker:
    image: eclipse-mosquitto:2.0
    restart: unless-stopped
    ports:
      # Mutual TLS only. The plaintext port is not published and the listener no
      # longer exists; the node and ingestion both authenticate with certificates.
      - "8883:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./certs:/mosquitto/certs:ro
      - broker_data:/mosquitto/data
      - broker_log:/mosquitto/log
    networks:
      default:
        # The name the broker certificate already carries in its subjectAltName.
        # Reaching it as "broker" would fail hostname verification; reaching it
        # by LAN address would leave the stack depending on the host's address.
        aliases:
          - psychron-broker

  fwserver:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8443:8443"
    volumes:
      - ./nginx/firmware.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/certs:ro
      - ./firmware:/firmware:ro

  api:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      PSYCHRON_ENV_FILE: /run/psychron.env
      PSYCHRON_DB_HOST: db
      # Bound to every interface *inside the container*, which is not the same
      # as being exposed: no port is published, so the only route in is Caddy
      # over the compose network.
      PSYCHRON_API_HOST: "0.0.0.0"
      # Only Caddy's own address is believed about X-Forwarded-For. Trusting the
      # whole subnet would let any container on it claim any client address, and
      # "new location for this account" is only worth showing if it is true.
      PSYCHRON_TRUSTED_PROXIES: 172.28.0.10
    command: ["python", "-m", "psychron.api"]
    volumes:
      - ./.env:/run/psychron.env:ro
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build:
      context: ../backend
    restart: unless-stopped
    environment:
      PSYCHRON_ENV_FILE: /run/psychron.env
      PSYCHRON_DB_HOST: db
      # Inside the network the broker is reached by name, which sidesteps the
      # host's native mosquitto on loopback entirely — the collision the LAN
      # address in .env exists to work around.
      PSYCHRON_MQTT_HOST: psychron-broker
      PSYCHRON_CERT_DIR: /certs
    command: ["psychron", "run"]
    volumes:
      - ./.env:/run/psychron.env:ro
      - ./certs:/certs:ro
    depends_on:
      db:
        condition: service_healthy
      broker:
        condition: service_started

  web:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "8444:8444"
    networks:
      default:
        # Fixed so the API can name exactly one trusted proxy. A dynamic address
        # would silently change on any recreate and quietly stop being trusted.
        ipv4_address: 172.28.0.10
    depends_on:
      - api
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - ../frontend/dist:/srv:ro
      - caddy_data:/data

networks:
  default:
    ipam:
      config:
        # Pinned only because one address in it has to be nameable in advance.
        - subnet: 172.28.0.0/24

volumes:
  caddy_data:
  db_data:
  broker_data:
  broker_log: