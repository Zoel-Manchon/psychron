persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice

# Each listener carries its own authentication model, so the plaintext port and
# the mutual-TLS port can coexist during the migration without one inheriting
# the other's rules by accident. Must appear before any listener.
per_listener_settings true

# The plaintext listener on 1883 used to live here, kept alive so the data flow
# was never interrupted while mTLS was proved out. It is gone, and with it the
# shared password: there is now no way to reach this broker without a
# certificate signed by our CA. Removing the listener rather than firewalling it
# matters — a port that is merely unreachable today is reachable the moment
# somebody changes a network rule.
#
# ── mutual TLS, the only way in ──────────────────────────────────────────────
listener 8883 0.0.0.0
protocol mqtt

cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key

# Both directions are verified. The client proves who it is with a certificate
# signed by our CA, and there is no password anywhere on this listener: a
# credential that cannot be copied out of a config file cannot go stale the way
# the shared password did.
require_certificate true

# The certificate's CN becomes the MQTT username, so the ACL written for the
# plaintext listener keeps working unchanged — but now keyed on cryptographic
# identity instead of a secret both sides had to hold.
use_identity_as_username true

tls_version tlsv1.2
allow_anonymous false
acl_file /mosquitto/config/acl
